services:
  app:
    build:
      context: .
      target: app
    environment:
      DATABASE_PATH: /data/machines.sqlite
    volumes:
      - machine-data:/data
    # Seed the default machine (only if it does not exist yet), then start php-fpm.
    command: sh -c "php bin/seed.php && exec php-fpm"
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  dev:
    build:
      context: .
      target: dev
    profiles: [ "dev" ]
    volumes:
      - .:/app

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  machine-data:
